<template>
    <lightning-card title="Property Location" icon-name="standard:map">
        <div class="slds-p-around_medium">
            <template if:true={hasLocation}>
                <lightning-map
                    map-markers={mapMarkers}
                    zoom-level="14"
                    markers-title="Property Location">
                </lightning-map>
            </template>
            <template if:false={hasLocation}>
                <p class="slds-text-color_weak">
                    Location not yet available — this property may still be geocoding, or the address could not be matched.
                </p>
            </template>
        </div>
    </lightning-card>
</template>
